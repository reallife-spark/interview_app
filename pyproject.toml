[project]
name = "interview-practice-app"
version = "0.1.0"
description = "A defensive, job-description-tailored interview practice app built with Streamlit and OpenRouter."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "streamlit>=1.40,<2",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10",
  "ruff>=0.8,<1",
  "import-linter>=2.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src/interview_practice"]
addopts = "-q"
markers = [
  "live: requires OPENROUTER_API_KEY and network access",
]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.importlinter]
root_package = "interview_practice"

[[tool.importlinter.contracts]]
name = "ui internals are private"
type = "protected"
protected_modules = ["interview_practice.ui._lib"]
allowed_importers = [
  "interview_practice.ui",
  "interview_practice.ui.*",
  "interview_practice.ui.**",
]

[[tool.importlinter.contracts]]
name = "ui tests are private"
type = "protected"
protected_modules = ["interview_practice.ui.tests"]
allowed_importers = [
  "interview_practice.ui.tests",
  "interview_practice.ui.tests.*",
  "interview_practice.ui.tests.**",
]

[[tool.importlinter.contracts]]
name = "tests never import implementation"
type = "forbidden"
source_modules = ["interview_practice.*.tests"]
forbidden_modules = ["interview_practice.*._lib"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "no package cycles"
type = "acyclic_siblings"
ancestors = ["interview_practice"]
